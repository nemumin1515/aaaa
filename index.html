<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211813">
<title>かぐや姫のむちゃぶり御前</title>
<style>
:root{--ink:#211813;--paper:#fff8e9;--gold:#e8bd69;--red:#8c3026;--green:#476253;--muted:#c7bba5;--line:#6c5135}
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden}body{font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;color:var(--paper);background:#17120f url("assets/stage.png") center/cover fixed}
button,input,textarea{font:inherit}button{border:0;cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}.shell{height:100%;width:100%;display:flex;flex-direction:column;background:linear-gradient(90deg,rgba(21,15,11,.82),rgba(26,18,12,.68) 48%,rgba(21,15,11,.82))}
.top{height:68px;flex:0 0 68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #bb9455;background:rgba(25,17,12,.88)}.brand{display:flex;align-items:center;gap:12px;font-family:serif;font-weight:800;letter-spacing:.08em}.moon{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7d0,#d7a94f 68%,#8d5528);box-shadow:0 0 18px #f1cf7b77}.net{font-size:12px;color:#d9c9ab}.net:before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#9c7253}.net.online:before{background:#73d99c;box-shadow:0 0 7px #73d99c}
.main{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.85fr);gap:16px;padding:16px;overflow:hidden}.stage{min-width:0;position:relative;display:flex;flex-direction:column;border:1px solid #b58a50;border-radius:14px;background:linear-gradient(#1c1818b5,#171212dd),url("assets/misu.png") center 15%/min(100%,900px) auto no-repeat;box-shadow:0 14px 50px #0008;overflow:hidden}.stage:before{content:"";position:absolute;inset:0;background:url("assets/suitor.png") left bottom/auto 52% no-repeat;opacity:.12;pointer-events:none}.stagehead{position:relative;z-index:1;padding:22px 26px 10px;text-align:center}.eyebrow{font-size:11px;letter-spacing:.3em;color:var(--gold)}h1{margin:4px 0 8px;font-family:serif;font-size:clamp(22px,3vw,36px);color:#fff1cd}.stagehead p{margin:0;color:#ddcfb4;font-size:13px}.treasure{position:relative;z-index:1;margin:0 auto;width:min(92%,690px);padding:15px 20px;display:grid;grid-template-columns:94px 1fr;gap:18px;align-items:center;border:1px solid #d6ae68;border-radius:12px;background:linear-gradient(110deg,#322217ed,#181412ed);box-shadow:0 8px 24px #0007}.treasure img{width:90px;height:80px;object-fit:contain;image-rendering:pixelated;background:#0002;border-radius:9px}.treasure .num{font-size:11px;color:#d1a85c;letter-spacing:.15em}.treasure h2{margin:3px 0;font-family:serif;color:#ffe9b6;font-size:clamp(18px,2.3vw,26px)}.treasure p{margin:4px 0 0;color:#d8c9ac;font-size:12px}.board{position:relative;z-index:1;display:flex;flex:1;min-height:0;flex-direction:column;overflow:auto;padding:16px 22px 20px}.section-label{font-size:11px;letter-spacing:.2em;color:#d8b36f;margin:0 0 10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-content:start}.entry{padding:12px;border:1px solid #755b3e;background:#191514dc;border-radius:10px}.entrytop{display:flex;justify-content:space-between;gap:8px;font-weight:700;color:#ffedca;font-size:14px}.entry small{color:#bdaa8b}.entry .object{color:#f3ca79;font-size:13px;margin:8px 0 4px}.entry .joke{margin:0;white-space:pre-wrap;line-height:1.5;color:#f7f0e6;font-size:14px;overflow-wrap:anywhere}.waiting{margin:auto;text-align:center;color:#c9baa1;max-width:430px;line-height:1.8}.waiting .seal{font-size:40px;display:block;margin-bottom:5px}.right{display:flex;flex-direction:column;min-height:0;gap:12px;overflow:auto}.panel{border:1px solid #997349;border-radius:12px;background:rgba(29,22,18,.94);box-shadow:0 8px 30px #0006;padding:16px}.panel h3{margin:0 0 12px;color:#f2d69e;font-family:serif;font-size:17px}.phase{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid #86683f;border-radius:99px;color:#f1d08b;font-size:11px}.phase:before{content:"";width:7px;height:7px;border-radius:50%;background:#e1b55e}.muted{color:#c4b49b;font-size:12px;line-height:1.6}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.btn{padding:10px 13px;border-radius:8px;color:#fff9eb;background:#6a3827;font-weight:700;box-shadow:inset 0 0 0 1px #bd8153}.btn.primary{color:#27190e;background:linear-gradient(#f3d88f,#d6aa59);box-shadow:inset 0 0 0 1px #fff0b3}.btn.soft{color:#f7e8c9;background:#37302a;box-shadow:inset 0 0 0 1px #635649}.btn.red{background:#8c3026}.btn.small{padding:6px 9px;font-size:12px}.btnblock{width:100%;margin-top:8px}.qrwrap{display:flex;align-items:center;gap:14px}.qr{background:#fff;padding:8px;border-radius:8px;min-width:130px;min-height:130px;display:grid;place-items:center}.peerid{font:11px ui-monospace,monospace;word-break:break-all;color:#ded0bb;margin-top:8px}.urlbox{font-size:10px;word-break:break-all;color:#b6a68c;margin-top:4px}.plist{display:flex;flex-direction:column;gap:7px}.person{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:8px 9px;background:#ffffff0b;border:1px solid #514133;border-radius:8px}.person .name{font-size:13px;color:#f7ecd4;font-weight:650}.person .status{font-size:10px;color:#b8a78b}.person .state{grid-column:1/-1;color:#cbb992;font-size:11px}.tag{padding:3px 7px;border:1px solid #816745;border-radius:99px;font-size:10px;color:#e6c783}.judge{border-top:1px solid #523f2c;margin-top:9px;padding-top:9px;display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}.judge select,.judge input{width:66px;padding:5px;background:#211a16;color:#fff1d4;border:1px solid #7b6344;border-radius:6px}.host-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;color:#dfcda9}.field input,.field textarea{width:100%;border:1px solid #806344;border-radius:8px;background:#17120f;color:#fff8e9;padding:11px;outline:none}.field input:focus,.field textarea:focus{border-color:#f0cc79;box-shadow:0 0 0 2px #f0cc7933}.field textarea{resize:vertical;min-height:92px;max-height:24vh}.counter{display:flex;justify-content:space-between;color:#b8a78b;font-size:11px}.mobilemode .main{display:flex;flex-direction:column;padding:10px;gap:10px}.mobilemode .stage{flex:1;min-height:0}.mobilemode .right{flex:0 0 auto;overflow:auto;max-height:47vh}.mobilemode .stagehead{padding:14px 12px 8px}.mobilemode .treasure{grid-template-columns:66px 1fr;padding:9px 12px;width:calc(100% - 16px);gap:12px}.mobilemode .treasure img{width:64px;height:58px}.mobilemode .board{padding:12px}.mobilemode .top{height:54px;flex-basis:54px;padding:0 14px}.mobilemode .brand{font-size:14px}.mobilemode .cards{grid-template-columns:1fr}.mobilemode .main{overflow:hidden}.client-result{text-align:center;padding:10px}.client-result strong{display:block;color:#f4d589;font-size:24px;margin:8px}.toast{position:fixed;z-index:10;left:50%;bottom:20px;transform:translateX(-50%);background:#17120f;border:1px solid #d4b574;color:#fff1d3;padding:10px 16px;border-radius:9px;box-shadow:0 6px 24px #0009;max-width:90vw;text-align:center}.foot{color:#b6a88f;font-size:10px;text-align:center;padding:4px 10px 8px}.hidden{display:none!important}
@media(max-width:850px){.main{grid-template-columns:1fr;grid-template-rows:minmax(320px,1fr) minmax(190px,.75fr);overflow:auto}.right{overflow:auto}.stage{min-height:330px}.top{height:58px;flex-basis:58px}.net{font-size:10px}}
</style>
<style>
.stagehead{padding-right:104px}.kaguya-laugh{position:absolute;z-index:2;right:22px;top:20px;width:76px;height:76px;background:url("assets/kaguya.png") 0 0/400% 400% no-repeat;image-rendering:pixelated;animation:kaguya-laugh 1.6s steps(1,end) infinite;filter:drop-shadow(0 4px 5px #0008)}
@keyframes kaguya-laugh{0%{background-position:0 0}6.25%{background-position:33.333% 0}12.5%{background-position:66.667% 0}18.75%{background-position:100% 0}25%{background-position:0 33.333%}31.25%{background-position:33.333% 33.333%}37.5%{background-position:66.667% 33.333%}43.75%{background-position:100% 33.333%}50%{background-position:0 66.667%}56.25%{background-position:33.333% 66.667%}62.5%{background-position:66.667% 66.667%}68.75%{background-position:100% 66.667%}75%{background-position:0 100%}81.25%{background-position:33.333% 100%}87.5%{background-position:66.667% 100%}93.75%,100%{background-position:100% 100%}}
.mobilemode .stagehead{padding-right:76px}.mobilemode .kaguya-laugh{width:56px;height:56px;right:10px;top:10px}
.judge input{width:100%}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(()=>{'use strict';
const TREASURES=[
 {name:'仏の御石の鉢',hint:'ありがたみのある「器」なら、材質も用途も問いません。堂々と本物だと言い切ろう。',image:0},
 {name:'蓬莱の玉の枝',hint:'根元から先まで、どこかに「玉」があれば勝負できるかも。',image:1},
 {name:'火鼠の裘（かわぎぬ）',hint:'火に強い、あたたかい、あるいは着られる。言い張り方が大事。',image:2},
 {name:'龍の首の珠',hint:'龍の気配がする珠。丸いものを見つけたら、あとは説明で押し切ろう。',image:3},
 {name:'燕の子安貝',hint:'燕が安心して子育てできそうな、貝っぽい何かを探そう。',image:4}
];
const PHASES={lobby:'参加受付',prep:'準備',operate:'操作中',confirm:'提出確定',reveal:'一斉公開',result:'結果発表'};
const KAGUYA_COMMENTS=['それ、宝物よりレシートを見せてほしいわ。','言い切る勇気だけは月まで届いたわね。','悔しいけれど、少し欲しくなったわ。','本物かどうかはさておき、笑ったから合格！'];
const app=document.getElementById('app');const qs=new URLSearchParams(location.search);const roomId=qs.get('room');
const pidKey='kaguya-player-id-v1',nameKey='kaguya-player-name-v1';
const participantId=localStorage.getItem(pidKey)||makeId();localStorage.setItem(pidKey,participantId);
let clientName=localStorage.getItem(nameKey)||'';let hostPeer=null,clientPeer=null,players=new Map(),phase='lobby',round=0,joinUrl='',snapshot=null,ready=false,toastTimer=null;
const isClient=Boolean(roomId);if(isClient)document.body.classList.add('mobilemode');
function makeId(){return (crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)).replace(/-/g,'')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let e=document.querySelector('.toast');if(!e){e=document.createElement('div');e.className='toast';document.body.appendChild(e)}e.textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),3000)}
function activeRound(){return isClient?Math.min(Math.max(Number(snapshot?.round)||0,0),4):round}
function currentTreasure(){return TREASURES[activeRound()]}
function visibleTotal(p){return phase==='result'?p.total:Object.entries(p.submissions).reduce((sum,[index,s])=>sum+(Number(index)<round?(s.points||0):0),0)}
function chrome(title,subtitle,network='接続待機中'){return `<div class="shell"><header class="top"><div class="brand"><span class="moon"></span><span>かぐや姫のむちゃぶり御前</span></div><div class="net" id="net">${esc(network)}</div></header><main class="main">${title}</main><div class="foot">ホスト主導のスター型通信 · 操作とゲーム状態は親PCが管理します</div></div>`}
function treasurePanel(){const t=currentTreasure();return `<div class="treasure"><img src="assets/treasure-${t.image+1}.png" alt="宝物のイメージ"><div><div class="num">難題 ${activeRound()+1} / 5</div><h2>${esc(t.name)}</h2><p>${esc(t.hint)}</p></div></div>`}
function updateNet(text,online=false){const e=document.getElementById('net');if(e){e.textContent=text;e.classList.toggle('online',online)}}
function stageBlock(entriesHtml='',label='御前のようす'){return `<section class="stage"><div class="kaguya-laugh" aria-label="笑うかぐや姫"></div><div class="stagehead"><div class="eyebrow">月の都 · 即興ボケ対決</div><h1>五つの難題、笑わせた者が勝ち</h1><p>身近な品を「本物の宝物」と言い切り、姫の心を動かせ。</p></div>${treasurePanel()}<div class="board"><div class="section-label">${esc(label)}</div>${entriesHtml||`<div class="waiting"><span class="seal">☾</span>まだ御前に提出はありません。<br>求婚者たちの支度を待っています。</div>`}</div></section>`}
function renderHost(){const t=currentTreasure();const playerList=[...players.values()];const entries=playerList.filter(p=>p.submissions[round]);const cards=['reveal','result'].includes(phase)?entries.map(p=>{const s=p.submissions[round];return `<article class="entry"><div class="entrytop"><span>${esc(p.name)}</span><span class="tag">${phase==='result'?`${s.points||0}点`:'判定中'}</span></div><div class="object">持参品：${esc(s.object)}</div><p class="joke">${esc(s.joke)}</p>${phase==='reveal'?`<div class="judge"><label>姫の判定</label><select data-score="${esc(p.id)}"><option value="0" ${s.points===0?'selected':''}>0点</option><option value="1" ${s.points===1?'selected':''}>1点</option><option value="2" ${s.points===2?'selected':''}>2点</option><option value="3" ${s.points===3?'selected':''}>3点</option></select><input data-comment="${esc(p.id)}" maxlength="60" value="${esc(s.comment||'')}" placeholder="姫のひと言（空欄なら自動）"><button class="btn small primary" data-award="${esc(p.id)}">判定保存</button></div>`:''}</article>`}).join(''):'';
 const roster=playerList.map(p=>`<div class="person"><div><div class="name">${esc(p.name)}</div><div class="status">${p.recovering?'◌ 復帰待ち':p.online?'● 接続中':'○ 一時離席中'} · ${p.ready?'準備OK':'準備中'} · 合計 ${visibleTotal(p)}点</div></div><button class="btn small soft" data-kick="${esc(p.id)}" title="参加者を退出">退出</button><div class="state">${p.submissions[round]?'提出済み':'未提出'}</div></div>`).join('')||'<div class="muted">参加者はまだいません。QRコードを読み取ってもらいましょう。</div>';
 let action='';if(phase==='lobby')action=`<button class="btn primary btnblock" data-action="prep">準備を始める</button>`;
 if(phase==='prep')action=`<button class="btn primary btnblock" data-action="operate">提出スタート</button>`;
 if(phase==='operate')action=`<button class="btn primary btnblock" data-action="confirm">提出を締め切る</button>`;
 if(phase==='confirm')action=`<button class="btn primary btnblock" data-action="reveal">全員へ一斉公開</button>`;
 if(phase==='reveal')action=`<button class="btn primary btnblock" data-action="result">結果を発表する</button>`;
 if(phase==='result')action=round<4?`<button class="btn primary btnblock" data-action="next">次の宝物へ</button>`:`<div class="muted" style="text-align:center;margin-top:10px">五つの難題、これにて結着！</div>`;
 const linkHtml=hostPeer?`<div class="qrwrap"><div class="qr" id="qr"></div><div><div class="muted">スマホでQRを読み取ると参加できます<br>参加上限：求婚者5人</div><div class="peerid">Peer ID: ${esc(hostPeer.id)}</div><div class="urlbox">${esc(joinUrl)}</div><button class="btn small soft" data-action="copy">参加URLをコピー</button></div></div>`:`<div class="muted">親PCで部屋を作り、Peer IDと参加QRを発行します。</div><button class="btn primary btnblock" data-action="create">部屋を作る</button>`;
 const leaderboard=phase==='result'&&round===4?`<section class="panel"><h3>最終順位</h3><div class="plist">${playerList.slice().sort((a,b)=>b.total-a.total).map((p,i)=>`<div class="person"><div class="name">${i===0?'👑 ':''}${i+1}位 · ${esc(p.name)}</div><span class="tag">${p.total}点</span></div>`).join('')}</div></section>`:'';
 const controls=`<div class="right"><section class="panel"><div class="row" style="justify-content:space-between"><h3>進行管理</h3><span class="phase">${PHASES[phase]}</span></div><div class="muted">${phase==='lobby'?'参加者がそろったら準備へ。':`難題 ${round+1}/5 · ${esc(t.name)}`}</div><div class="host-actions" style="margin-top:11px"><span class="tag">接続 ${playerList.filter(p=>p.online).length}/5</span><span class="tag">提出 ${entries.length}/${playerList.length}</span></div>${action}</section><section class="panel"><h3>参加用QRコード</h3>${linkHtml}</section><section class="panel"><div class="row" style="justify-content:space-between"><h3>求婚者</h3><span class="tag">最大5人</span></div><div class="plist">${roster}</div></section>${leaderboard}</div>`;
 const board=cards?`<div class="cards">${cards}</div>`:`<div class="waiting"><span class="seal">📜</span>公開まで宝物は封印中。<br>${entries.length}件の提出を受け付けています。</div>`;
 app.innerHTML=chrome(`${stageBlock(board,'提出された現代の宝物')}${controls}`,'','Host · 親PC');if(hostPeer&&window.QRCode){const q=document.getElementById('qr');if(q){q.innerHTML='';new QRCode(q,{text:joinUrl,width:114,height:114,colorDark:'#211813',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}}
}
function stateFor(p){const submitted=p?.submissions?.[round];return {phase,round,treasure:currentTreasure(),roster:[...players.values()].map(x=>({id:x.id,name:x.name,online:x.online,recovering:x.recovering,ready:x.ready,submitted:Boolean(x.submissions[round]),total:visibleTotal(x)})),submitted:Boolean(submitted),submission:phase==='result'?submitted:null,entries:['reveal','result'].includes(phase)?[...players.values()].filter(x=>x.submissions[round]).map(x=>{const s=x.submissions[round];return phase==='result'?{id:x.id,name:x.name,object:s.object,joke:s.joke,points:s.points,comment:s.comment}:{id:x.id,name:x.name,object:s.object,joke:s.joke}}):[],total:p?visibleTotal(p):0}}
function send(conn,msg){if(conn&&conn.open)try{conn.send(msg)}catch{}}
function broadcast(){for(const p of players.values())if(p.conn&&p.conn.open)send(p.conn,{type:'state',state:stateFor(p)})}
function renderClient(){const keepObject=document.getElementById('object')?.value||'',keepJoke=document.getElementById('joke')?.value||'';const activeId=['object','joke'].includes(document.activeElement?.id)?document.activeElement.id:null;const caret=document.activeElement?.selectionStart;const s=snapshot||{phase:'lobby',round:0,treasure:TREASURES[0],roster:[],entries:[],submitted:false};const entries=(s.entries||[]).map((x,i)=>`<article class="entry"><div class="entrytop"><span>${esc(x.name)}</span><span class="tag">${i+1}人目</span></div><div class="object">持参品：${esc(x.object)}</div><p class="joke">${esc(x.joke)}</p>${s.phase==='result'?`<div class="muted" style="margin-top:8px">姫の判定：${x.points||0}点${x.comment?' · '+esc(x.comment):''}</div>`:''}</article>`).join('');let content='';
 if(!clientName){content=`<div class="panel" style="max-width:480px;margin:auto"><h3>求婚者として参加</h3><div class="muted">呼ばれたい名前を入力してください。</div><div class="field"><label>ニックネーム（12文字まで）</label><input id="nickname" maxlength="12" autocomplete="nickname" value="${esc(clientName)}" placeholder="例：月見だんご"></div><button class="btn primary btnblock" data-action="join">御前に参上する</button></div>`}
 else if(s.phase==='lobby')content=`<div class="waiting"><span class="seal">☾</span>${esc(clientName)}さま、御前へようこそ。<br>ホストが準備を始めるまでお待ちください。</div>`;
 else if(s.phase==='prep')content=`<div class="panel" style="max-width:480px;margin:auto;text-align:center"><h3>支度を整えましょう</h3><p class="muted">お題を確認して、提出の準備ができたら押してください。</p><button class="btn primary" data-action="ready">${ready?'準備OK ✓':'準備OKにする'}</button></div>`;
 else if(s.phase==='operate'){if(s.submitted)content=`<div class="panel" style="max-width:480px;margin:auto;text-align:center"><h3>提出を受け付けました</h3><p class="muted">姫がほかの求婚者のボケも見られるよう、提出を隠して待ちます。</p><span class="tag">提出済み · 確定待ち</span></div>`;else content=`<div class="panel" style="max-width:520px;margin:auto"><h3>本物の宝物を持参！</h3><p class="muted">日用品をひとつ選び、宝物だと言い張るボケを考えてください。</p><div class="field"><label>持ってきた日用品</label><input id="object" data-keep="object" maxlength="40" placeholder="例：スマートフォン"></div><div class="field"><label>かぐや姫へのボケ・言い訳</label><textarea id="joke" data-keep="joke" maxlength="180" placeholder="例：この画面の中に玉が五つ、いつでも光ります！"></textarea><div class="counter"><span>短くてもOK。堂々と言い切ろう。</span><span id="joke-count">0 / 180</span></div></div><button class="btn primary btnblock" data-action="submit">これが本物です！</button></div>`}
 else if(s.phase==='confirm')content=`<div class="waiting"><span class="seal">📜</span>提出を締め切りました。<br>全員への一斉公開をお待ちください。</div>`;
 else if(s.phase==='reveal')content=`<div class="waiting"><span class="seal">🎭</span>全員のボケが公開されました。<br>かぐや姫が判定中です……</div>`;
 else if(s.phase==='result')content=`<div class="client-result"><div class="eyebrow">姫のご判定</div><strong>${s.submission?.points||0} 点</strong><div class="muted">${s.submission?.comment?esc(s.submission.comment):'姫のひと言はありません'}</div><div class="tag" style="display:inline-block;margin-top:10px">累計 ${s.total||0}点</div></div>`;
 const boardLabel=['reveal','result'].includes(s.phase)?'一斉公開されたボケ':'御前のようす';const stage=stageBlock(['reveal','result'].includes(s.phase)?entries:'',boardLabel);const ranked=(s.roster||[]).slice().sort((a,b)=>b.total-a.total);const finalBoard=s.phase==='result'&&s.round===4?`<section class="panel"><h3>五つの難題・最終順位</h3><div class="plist">${ranked.map((p,i)=>`<div class="person"><div><div class="name">${i===0?'👑 ':''}${i+1}位 · ${esc(p.name)}</div></div><span class="tag">${p.total}点</span></div>`).join('')||'<div class="muted">順位はありません。</div>'}</div></section>`:'';const side=`<div class="right"><section class="panel"><div class="row" style="justify-content:space-between"><h3>${esc(PHASES[s.phase]||'参加受付')}</h3><span class="tag">難題 ${Math.min((s.round||0)+1,5)}/5</span></div><div class="muted">接続先のホストPCと直接通信しています。画面を閉じた場合は再表示後に自動で再接続します。</div><div id="client-content">${content}</div></section><section class="panel"><h3>求婚者たち</h3><div class="plist">${(s.roster||[]).map(p=>`<div class="person"><div><div class="name">${esc(p.name)}${p.id===participantId?'（あなた）':''}</div><div class="status">${p.recovering?'◌ 復帰待ち':p.online?'● 接続中':'○ 一時離席中'}</div></div><span class="tag">${p.total}点</span><div class="state">${p.submitted?'提出済み':p.ready?'準備OK':'待機中'}</div></div>`).join('')||'<div class="muted">接続しています…</div>'}</div></section>${finalBoard}</div>`;
 app.innerHTML=chrome(`${stage}${side}`,'',snapshot?'ホストと接続中':'接続を試みています');updateNet(snapshot?'ホストと接続中':'再接続中',Boolean(snapshot));
 const n=app.querySelector('#object'),j=app.querySelector('#joke');if(n)n.value=keepObject;if(j){j.value=keepJoke;const updateCount=()=>{const c=document.getElementById('joke-count');if(c)c.textContent=`${j.value.length} / 180`};updateCount();j.addEventListener('input',updateCount)}if(activeId){const field=app.querySelector(`#${activeId}`);if(field){field.focus({preventScroll:true});if(Number.isInteger(caret))field.setSelectionRange(caret,caret)}}
}
function enterPhase(next){phase=next;broadcast();renderHost()}
function validString(v,max){return typeof v==='string'&&v.trim().length>0&&v.trim().length<=max}
function handleHostMessage(conn,msg){if(!msg||typeof msg!=='object'||typeof msg.type!=='string')return;
 if(msg.type==='join'){const id=String(msg.participantId||'');const name=String(msg.nickname||'').trim();if(!/^[a-zA-Z0-9]{12,80}$/.test(id)||!validString(name,12)){send(conn,{type:'reject',reason:'名前または参加情報を確認してください。'});return}
  let p=players.get(id);if(!p){if(phase!=='lobby'){send(conn,{type:'reject',reason:'ゲーム開始後の新規参加はできません。ホストにQRの再発行を頼んでください。'});return}if(players.size>=5){send(conn,{type:'reject',reason:'参加人数は5人までです。'});return}p={id,name,ready:false,online:true,recovering:false,total:0,submissions:{},conn:null,disconnectTimer:null};players.set(id,p)}
  if(p.disconnectTimer){clearTimeout(p.disconnectTimer);p.disconnectTimer=null}if(p.conn&&p.conn!==conn){try{p.conn.close()}catch{}}p.name=name;p.conn=conn;p.online=true;p.recovering=false;conn.__player=id;send(conn,{type:'joined',participantId:id,state:stateFor(p)});broadcast();renderHost();return}
 const id=conn.__player,p=players.get(id);if(!p||p.conn!==conn)return;
 if(msg.type==='ping'){send(conn,{type:'pong'});if(!p.online||p.recovering){p.online=true;p.recovering=false;broadcast();renderHost()}return}
 if(msg.type==='ready'&&phase==='prep'){p.ready=true;broadcast();renderHost();return}
 if(msg.type==='submit'&&phase==='operate'){if(p.submissions[round]){send(conn,{type:'notice',text:'この難題はすでに提出済みです。'});return}const object=String(msg.object||'').trim(),joke=String(msg.joke||'').trim();if(!validString(object,40)||!validString(joke,180)){send(conn,{type:'notice',text:'日用品とボケを入力してください（各文字数に上限があります）。'});return}p.submissions[round]={object,joke,points:0,comment:''};send(conn,{type:'notice',text:'提出を受け付けました。'});broadcast();renderHost()}
}
function startHost(){if(!window.Peer){toast('PeerJSを読み込めません。ネット接続を確認してください。');return}updateNet('部屋を作成中…');hostPeer=new Peer(undefined,{debug:1});hostPeer.on('open',id=>{joinUrl=new URL(location.href);joinUrl.search='';joinUrl.hash='';joinUrl.searchParams.set('room',id);joinUrl=joinUrl.toString();renderHost()});hostPeer.on('connection',conn=>{conn.on('open',()=>{});conn.on('data',d=>{let m=d;try{if(typeof d==='string')m=JSON.parse(d)}catch{return}handleHostMessage(conn,m)});conn.on('close',()=>{const p=players.get(conn.__player);if(p&&p.conn===conn){p.recovering=true;if(p.disconnectTimer)clearTimeout(p.disconnectTimer);p.disconnectTimer=setTimeout(()=>{if(p.conn===conn){p.online=false;p.recovering=false;p.ready=false;broadcast();renderHost()}},90000);broadcast();renderHost()}});conn.on('error',()=>{})});hostPeer.on('disconnected',()=>{updateNet('通信サーバー再接続中…');try{hostPeer.reconnect()}catch{}});hostPeer.on('error',e=>{toast('部屋を作成できませんでした：'+(e.type||'通信エラー'));updateNet('接続エラー')});updateNet('部屋を作成中…')}
function connectClient(){if(!roomId||!window.Peer)return;if(document.visibilityState==='hidden')return;if(clientPeer&&clientPeer.destroyed)clientPeer=null;if(!clientPeer){clientPeer=new Peer(undefined,{debug:1});clientPeer.on('open',()=>openRoomConnection());clientPeer.on('disconnected',()=>{updateNet('通信サーバー再接続中…');try{clientPeer.reconnect()}catch{}});clientPeer.on('error',()=>{updateNet('ホストへの再接続を試みています');if(clientPeer?.destroyed){clientPeer=null;setTimeout(connectClient,3000)}else scheduleClientRetry()})}else if(clientPeer.open)openRoomConnection()}
function openRoomConnection(){if(!clientPeer||clientPeer.__rejected||!clientPeer.open||document.visibilityState==='hidden')return;if(clientPeer.__connecting||clientPeer.__conn?.open)return;clientPeer.__connecting=true;const c=clientPeer.connect(roomId,{reliable:true});clientPeer.__conn=c;c.on('open',()=>{clientPeer.__connecting=false;clientPeer.__lastPong=Date.now();if(clientName)send(c,{type:'join',participantId,nickname:clientName});updateNet(clientName?'ホストに接続中…':'ニックネームを入力してください',Boolean(clientName));if(clientPeer.__retry){clearInterval(clientPeer.__retry);clientPeer.__retry=null}});c.on('data',d=>{let m=d;try{if(typeof d==='string')m=JSON.parse(d)}catch{return}if(m.type==='joined'){localStorage.setItem(nameKey,clientName);snapshot=m.state;ready=Boolean(snapshot.roster?.find(x=>x.id===participantId)?.ready);renderClient()}else if(m.type==='state'){snapshot=m.state;ready=Boolean(snapshot.roster?.find(x=>x.id===participantId)?.ready);renderClient()}else if(m.type==='pong'){clientPeer.__lastPong=Date.now()}else if(m.type==='reject'){clientPeer.__rejected=true;toast(m.reason||'参加できません');updateNet('参加できません');try{c.close()}catch{}}else if(m.type==='notice')toast(m.text)});c.on('close',()=>{clientPeer.__connecting=false;if(!clientPeer.__rejected){updateNet('再接続中…');scheduleClientRetry()}});c.on('error',()=>{clientPeer.__connecting=false;if(!clientPeer.__rejected)scheduleClientRetry()})}
function scheduleClientRetry(){if(!clientPeer||clientPeer.__retry)return;clientPeer.__retry=setInterval(()=>openRoomConnection(),3000)}
if(!isClient){phase='lobby';renderHost()}else{if(clientName)clientName=localStorage.getItem(nameKey)||'';renderClient();connectClient();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){setTimeout(connectClient,250);if(clientPeer?.__conn?.open){const before=clientPeer.__lastPong||0;send(clientPeer.__conn,{type:'ping'});setTimeout(()=>{if(clientPeer?.__conn?.open&&(clientPeer.__lastPong||0)<=before){try{clientPeer.__conn.close()}catch{}scheduleClientRetry()}},6000)}}});setInterval(()=>{if(document.visibilityState==='visible'&&clientPeer?.__conn?.open){if(Date.now()-(clientPeer.__lastPong||Date.now())>45000){try{clientPeer.__conn.close()}catch{}scheduleClientRetry()}else send(clientPeer.__conn,{type:'ping'})}},15000);setTimeout(scheduleClientRetry,4000)}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action],[data-award],[data-kick]');if(!btn)return;const action=btn.dataset.action;
 if(btn.dataset.kick){const p=players.get(btn.dataset.kick);if(p){send(p.conn,{type:'reject',reason:'ホストが退出にしました。'});try{p.conn?.close()}catch{}players.delete(p.id);broadcast();renderHost()}return}
 if(btn.dataset.award){const p=players.get(btn.dataset.award),select=app.querySelector(`[data-score="${CSS.escape(btn.dataset.award)}"]`),input=app.querySelector(`[data-comment="${CSS.escape(btn.dataset.award)}"]`);if(p?.submissions[round]){const points=Math.max(0,Math.min(3,Number(select?.value)||0));p.submissions[round].points=points;p.submissions[round].comment=String(input?.value||'').trim().slice(0,60)||KAGUYA_COMMENTS[points];p.total=Object.values(p.submissions).reduce((a,x)=>a+(x.points||0),0);broadcast();renderHost()}return}
 if(action==='create'){startHost();return}if(action==='copy'){navigator.clipboard?.writeText(joinUrl).then(()=>toast('参加URLをコピーしました')).catch(()=>toast('URLを選択してコピーしてください'));return}
 if(action==='prep'){if(players.size===0){toast('参加者が1人以上必要です');return}round=0;phase='prep';players.forEach(p=>p.ready=false);broadcast();renderHost();return}
 if(action==='operate'){enterPhase('operate');return}if(action==='confirm'){enterPhase('confirm');return}if(action==='reveal'){enterPhase('reveal');return}if(action==='result'){players.forEach(p=>{if(p.submissions[round]){const s=p.submissions[round];if(!s.comment)s.comment=KAGUYA_COMMENTS[s.points||0];p.total=Object.values(p.submissions).reduce((a,x)=>a+(x.points||0),0)}});enterPhase('result');return}
 if(action==='next'){round++;players.forEach(p=>p.ready=false);phase='prep';broadcast();renderHost();return}
 if(action==='join'){const field=document.getElementById('nickname');clientName=String(field?.value||'').trim();if(!clientName){toast('ニックネームを入力してください');return}if(clientName.length>12){toast('ニックネームは12文字以内です');return}localStorage.setItem(nameKey,clientName);if(clientPeer?.__conn?.open)send(clientPeer.__conn,{type:'join',participantId,nickname:clientName});else connectClient();return}
 if(action==='ready'){ready=true;if(clientPeer?.__conn?.open)send(clientPeer.__conn,{type:'ready'});renderClient();return}
 if(action==='submit'){const object=document.getElementById('object')?.value||'',joke=document.getElementById('joke')?.value||'';if(!object.trim()||!joke.trim()){toast('日用品とボケの両方を入力してください');return}send(clientPeer?.__conn,{type:'submit',object,joke});return}
});
})();
